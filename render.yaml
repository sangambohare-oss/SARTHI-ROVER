services:
  - type: web
    name: agrivision-ai
    env: node
    plan: free
    buildCommand: npm install --no-audit && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
